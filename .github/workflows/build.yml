name: Build apps

# Pushes and pull requests only run the tests. The apps are built for release tags
# (vX.Y.Z), which also attach them to the GitHub release of that tag, and when
# started by hand under Actions → "Build apps" → "Run workflow".
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also benchmark the AI upscaler settings on the Mac"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  build-macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app, disk image and update zip
        run: scripts/build_macos.sh

      - name: Check the window opens
        run: YTD_SMOKE_TEST=1 "dist/YouTube Downloader.app/Contents/MacOS/YouTube Downloader"

      - name: Upscale with all three models
        run: |
          APP="dist/YouTube Downloader.app/Contents"
          "$APP/Frameworks/bin/ffmpeg" -loglevel error -y -f lavfi -i testsrc2=size=160x90:rate=10:duration=1 \
            -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/tiny.mp4"
          for model in fast animation realistic; do
            "$APP/MacOS/YouTube Downloader" --upscale-file "$RUNNER_TEMP/tiny.mp4" --upscale-to 1080 \
              --content "$model" -o "$RUNNER_TEMP/upscaled" -v
          done
          ls -la "$RUNNER_TEMP/upscaled"

      - name: Benchmark AI upscaler settings
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: python scripts/bench_upscale.py "dist/YouTube Downloader.app"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-macOS-arm64
          path: |
            dist/*.dmg
            dist/*-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        run: python scripts/build_windows.py

      - name: Check the window opens
        run: |
          $env:YTD_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "dist\YouTube Downloader\YouTube Downloader.exe" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }

      - name: Upscale with the bundled ONNX engine (on the CPU; CI has no NVIDIA GPU)
        run: |
          $cli = "dist\YouTube Downloader\youtube-downloader-cli.exe"
          & "dist\YouTube Downloader\_internal\bin\ffmpeg.exe" -loglevel error -y -f lavfi `
            -i testsrc2=size=160x90:rate=10:duration=0.5 -c:v libx264 -pix_fmt yuv420p "$env:RUNNER_TEMP\tiny.mp4"
          $env:YTD_UPSCALE_ENGINE = "onnx-cpu"
          & $cli --upscale-file "$env:RUNNER_TEMP\tiny.mp4" --upscale-to 1080 --content fast -o "$env:RUNNER_TEMP\up" -v
          if ($LASTEXITCODE -ne 0) { throw "ONNX upscale failed" }
          Get-ChildItem "$env:RUNNER_TEMP\up"

      - name: Install silently and relaunch, as the in-app updater does
        run: |
          $setup = Get-ChildItem dist\*Setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/SILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          & "${env:ProgramFiles}\YouTube Downloader\youtube-downloader-cli.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed app failed its self-test" }

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Windows-x64
          path: dist/*Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md

      # Creates the release, or fills in the one made on GitHub for this tag.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YouTube Downloader ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
          make_latest: true
