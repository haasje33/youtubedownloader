name: Build apps

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the app ships with the newest yt-dlp (YouTube changes often).
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app and disk image
        run: scripts/build_macos.sh

      - name: Check the window opens
        run: YTD_SMOKE_TEST=1 "dist/YouTube Downloader.app/Contents/MacOS/YouTube Downloader"

      - name: Try a real download (best effort, CI IPs are often blocked by YouTube)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          "dist/YouTube Downloader.app/Contents/MacOS/YouTube Downloader" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" -q 360 -o "$RUNNER_TEMP/downloads" -v
          ls -la "$RUNNER_TEMP/downloads"

      - name: Try AI upscaling (best effort, CI machines may have no usable GPU)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP="dist/YouTube Downloader.app/Contents"
          "$APP/Frameworks/bin/ffmpeg" -loglevel error -y -f lavfi -i testsrc2=size=160x90:rate=10:duration=1 \
            -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/tiny.mp4"
          for model in fast animation realistic; do
            "$APP/MacOS/YouTube Downloader" --upscale-file "$RUNNER_TEMP/tiny.mp4" --upscale-to 1080 \
              --content "$model" -o "$RUNNER_TEMP/upscaled" -v
          done
          ls -la "$RUNNER_TEMP/upscaled"

      - name: Benchmark AI upscaler settings (informational)
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/bench_upscale.py "dist/YouTube Downloader.app"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        run: python scripts/build_windows.py

      - name: Check the window opens
        run: |
          $env:YTD_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "dist\YouTube Downloader\YouTube Downloader.exe" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }

      - name: Upscale with the bundled ONNX engine (on the CPU; CI has no NVIDIA GPU)
        run: |
          $cli = "dist\YouTube Downloader\youtube-downloader-cli.exe"
          & "dist\YouTube Downloader\_internal\bin\ffmpeg.exe" -loglevel error -y -f lavfi `
            -i testsrc2=size=160x90:rate=10:duration=0.5 -c:v libx264 -pix_fmt yuv420p "$env:RUNNER_TEMP\tiny.mp4"
          $env:YTD_UPSCALE_ENGINE = "onnx-cpu"
          & $cli --upscale-file "$env:RUNNER_TEMP\tiny.mp4" --upscale-to 1080 --content fast -o "$env:RUNNER_TEMP\up" -v
          if ($LASTEXITCODE -ne 0) { throw "ONNX upscale failed" }
          Get-ChildItem "$env:RUNNER_TEMP\up"

      - name: Try the Vulkan engine (best effort, no GPU on CI)
        continue-on-error: true
        run: |
          $env:YTD_UPSCALE_ENGINE = "ncnn"
          & "dist\YouTube Downloader\youtube-downloader-cli.exe" --upscale-file "$env:RUNNER_TEMP\tiny.mp4" `
            --upscale-to 1080 --content fast -o "$env:RUNNER_TEMP\up" -v

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Windows-x64
          path: |
            dist/*Setup.exe
            dist/*Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*Setup.exe
            artifacts/*Windows-x64.zip
          generate_release_notes: true
