name: Build apps

# Every push to main builds both apps. If the version in src/ytdownloader/__init__.py
# has no release yet, the build creates tag vX.Y.Z and the GitHub release with the
# apps, SHA256SUMS.txt and the notes from CHANGELOG.md. Other branches and pull
# requests only run the tests. Builds can also be started by hand (Run workflow).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Also benchmark the AI upscaler settings on the Mac"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  build-macos:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app, disk image and update zip
        run: scripts/build_macos.sh

      - name: Check the window opens
        run: YTD_SMOKE_TEST=1 "dist/YouTube Downloader.app/Contents/MacOS/YouTube Downloader"

      - name: Upscale with all three models
        run: |
          APP="dist/YouTube Downloader.app/Contents"
          "$APP/Frameworks/bin/ffmpeg" -loglevel error -y -f lavfi -i testsrc2=size=160x90:rate=10:duration=1 \
            -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/tiny.mp4"
          for model in fast animation realistic; do
            "$APP/MacOS/YouTube Downloader" --upscale-file "$RUNNER_TEMP/tiny.mp4" --upscale-to 1080 \
              --content "$model" -o "$RUNNER_TEMP/upscaled" -v
          done
          ls -la "$RUNNER_TEMP/upscaled"

      - name: Benchmark AI upscaler settings
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: python scripts/bench_upscale.py "dist/YouTube Downloader.app"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-macOS-arm64
          path: |
            dist/*.dmg
            dist/*-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        run: python scripts/build_windows.py

      - name: Check the window opens
        run: |
          $env:YTD_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "dist\YouTube Downloader\YouTube Downloader.exe" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }

      - name: Upscale with the bundled ONNX engine (on the CPU; CI has no NVIDIA GPU)
        run: |
          $cli = "dist\YouTube Downloader\youtube-downloader-cli.exe"
          & "dist\YouTube Downloader\_internal\bin\ffmpeg.exe" -loglevel error -y -f lavfi `
            -i testsrc2=size=160x90:rate=10:duration=0.5 -c:v libx264 -pix_fmt yuv420p "$env:RUNNER_TEMP\tiny.mp4"
          $env:YTD_UPSCALE_ENGINE = "onnx-cpu"
          & $cli --upscale-file "$env:RUNNER_TEMP\tiny.mp4" --upscale-to 1080 --content fast -o "$env:RUNNER_TEMP\up" -v
          if ($LASTEXITCODE -ne 0) { throw "ONNX upscale failed" }
          Get-ChildItem "$env:RUNNER_TEMP\up"

      # CI has no NVIDIA GPU, so the NVIDIA package download is forced. A package
      # built in this run isn't published yet; it is served from this machine.
      - name: Install silently with the NVIDIA package, as the in-app updater does
        run: |
          $setup = Get-ChildItem dist\*Setup.exe | Select-Object -First 1
          $setupArgs = "/SILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS /NVIDIAPACK=force /LOG=`"$env:RUNNER_TEMP\setup.log`""
          $server = $null
          if (Test-Path dist\nvidia-pack\nvidia_pack.json) {
            $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "dist\nvidia-pack" -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 3
            $setupArgs += " /NVIDIABASEURL=http://127.0.0.1:8765/"
          }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList $setupArgs -PassThru -Wait
          if ($server) { Stop-Process -Id $server.Id -Force }
          Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $cli = "${env:ProgramFiles}\YouTube Downloader\youtube-downloader-cli.exe"
          $out = & $cli --self-test | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "Installed app failed its self-test" }
          # Loading the providers needs every CUDA/cuDNN DLL from the package, but no GPU.
          if ($out -notmatch "cuda provider DLLs: ok") { throw "The CUDA provider can't load the NVIDIA package" }
          $version = (Get-Content "dist\YouTube Downloader\_internal\nvidia_pack.json" | ConvertFrom-Json).version
          if (-not (Test-Path "$env:ProgramData\YouTube Downloader\nvidia\$version\.complete")) {
            throw "The installer did not install NVIDIA package $version"
          }
          Get-ChildItem "$env:ProgramData\YouTube Downloader\nvidia\$version" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Windows-x64
          path: dist/*Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/nvidia-pack/nvidia_pack.json') != ''
        with:
          name: NVIDIA-pack
          path: dist/nvidia-pack/*
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this is a new release
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ytdownloader/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing new release v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          pattern: YouTube-Downloader-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          pattern: NVIDIA-pack
          path: nvidia-pack
          merge-multiple: true

      # The NVIDIA package has its own release (nvidia-<version>), made only when it changed.
      - name: Publish the NVIDIA package
        if: steps.version.outputs.release == 'true' && hashFiles('nvidia-pack/nvidia_pack.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pack=$(jq -r .version nvidia-pack/nvidia_pack.json)
          if gh release view "nvidia-$pack" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "nvidia-$pack is already published."
          else
            ls -la nvidia-pack
            gh release create "nvidia-$pack" nvidia-pack/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "NVIDIA support package $pack" \
              --notes "CUDA, cuDNN and TensorRT for YouTube Downloader on Windows. Downloaded by the installer and the app; you don't need to download this yourself."
          fi

      - name: Checksums and release notes
        if: steps.version.outputs.release == 'true'
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python scripts/release_notes.py "${{ steps.version.outputs.version }}" > notes.md
          cat notes.md

      # Creates tag vX.Y.Z on this commit and the release, or fills in an existing one.
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YouTube Downloader v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: artifacts/*
          make_latest: true
